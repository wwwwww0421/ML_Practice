[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlib"
version = "0.1.0"
description = "A library for detecting fraud activities."
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "mlflow>=1.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]